name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project.zip
        run: |
          test -f project.zip || { echo "project.zip not found in repo root"; exit 1; }
          mkdir -p src
          unzip -o project.zip -d src
          ls -la src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: src
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: boardsight-apk
          path: src/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release (direct .apk download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BoardSight build ${{ github.run_number }}
          files: src/app/build/outputs/apk/debug/app-debug.apk
